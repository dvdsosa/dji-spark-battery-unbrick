<text x="150" y="462">A5</text><text x="310" y="462">5V</text><text x="470" y="462">GND</text><text x="550" y="462">A4</text>
<text x="350" y="508">Arduino Uno / Nano, alimentado por USB</text>
</g>
<g font-size="12" fill="#0F6E56"><text x="150" y="478">SCL</text><text x="550" y="478">SDA</text></g>
</g>
<g font-size="12" fill="#444441">
<rect x="100" y="546" width="12" height="12" rx="2" fill="#7F77DD"/><text x="118" y="556">datos</text>
<rect x="170" y="546" width="12" height="12" rx="2" fill="#D85A30"/><text x="188" y="556">alimentación</text>
<rect x="282" y="546" width="12" height="12" rx="2" fill="#888780"/><text x="300" y="556">masa</text>
<text x="350" y="556">R1, R2 = 4,7 kΩ</text>
