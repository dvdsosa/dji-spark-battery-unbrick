<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Conexión batería DJI Spark a Arduino con pila de 9 V (alternativa, no probada)</title>
<rect width="680" height="600" fill="#FFFFFF"/>
<g text-anchor="middle">
<rect x="175" y="20" width="190" height="54" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="270" y="42" font-size="14" font-weight="600" fill="#712B13">Pila 9 V (temporal)</text>
<text x="270" y="62" font-size="12" fill="#993C1D">nunca al Arduino</text>
</g>
<g stroke-width="1.8" fill="none">
<line x1="230" y1="74" x2="230" y2="118" stroke="#888780"/>
<line x1="310" y1="74" x2="310" y2="118" stroke="#D85A30"/>
<line x1="150" y1="160" x2="150" y2="440" stroke="#7F77DD"/>
<line x1="550" y1="160" x2="550" y2="440" stroke="#7F77DD"/>
<line x1="470" y1="160" x2="470" y2="440" stroke="#888780"/>
<path d="M150 220 H230 V240" stroke="#7F77DD"/>
<path d="M550 220 H510 V240" stroke="#7F77DD"/>
<path d="M230 300 V360 H310" stroke="#D85A30"/>
<path d="M510 300 V360 H478 A8 8 0 0 0 462 360 H310" stroke="#D85A30"/>
<line x1="310" y1="360" x2="310" y2="440" stroke="#D85A30"/>
</g>
<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8">
<rect x="222" y="240" width="16" height="60" rx="2"/>
<rect x="502" y="240" width="16" height="60" rx="2"/>
</g>
<circle cx="150" cy="220" r="3.5" fill="#7F77DD"/>
<circle cx="550" cy="220" r="3.5" fill="#7F77DD"/>
<circle cx="310" cy="360" r="3.5" fill="#D85A30"/>
<g font-size="12" fill="#444441">
<text x="222" y="96" text-anchor="end">−</text>
<text x="318" y="96">+</text>
<text x="380" y="98">Batería Spark, contactos hacia ti</text>
<text x="246" y="266">R1</text>
<text x="246" y="282">4,7 kΩ</text>
<text x="486" y="266" text-anchor="middle">R2</text>
</g>
<rect x="100" y="104" width="500" height="72" rx="6" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
<g text-anchor="middle">
<g><rect x="120" y="118" width="60" height="42" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="150" y="136" font-size="14" font-weight="600" fill="#3C3489">SCL</text><text x="150" y="152" font-size="12" fill="#534AB7">pin 1</text></g>
<g><rect x="200" y="118" width="60" height="42" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="230" y="136" font-size="14" font-weight="600" fill="#444441">GND</text><text x="230" y="152" font-size="12" fill="#5F5E5A">pin 2</text></g>
<g><rect x="280" y="118" width="60" height="42" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="310" y="136" font-size="14" font-weight="600" fill="#712B13">BAT+</text><text x="310" y="152" font-size="12" fill="#993C1D">pin 3</text></g>
<g><rect x="360" y="118" width="60" height="42" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="390" y="136" font-size="14" font-weight="600" fill="#712B13">BAT+</text><text x="390" y="152" font-size="12" fill="#993C1D">pin 4</text></g>
<g><rect x="440" y="118" width="60" height="42" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="470" y="136" font-size="14" font-weight="600" fill="#444441">GND</text><text x="470" y="152" font-size="12" fill="#5F5E5A">pin 5</text></g>
<g><rect x="520" y="118" width="60" height="42" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="550" y="136" font-size="14" font-weight="600" fill="#3C3489">SDA</text><text x="550" y="152" font-size="12" fill="#534AB7">pin 6</text></g>
<rect x="100" y="440" width="500" height="84" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
